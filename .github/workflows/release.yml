name: Release

# Builds Linux and macOS binaries whenever a tag matching `v*` (e.g. v0.1.0)
# is pushed, packages them with the repo's own bundling scripts
# (script/bundle-linux, script/bundle-mac), and publishes them to a GitHub
# Release with auto-generated release notes.
#
# This replaces upstream Zed's release.yml, which only runs for the
# zed-industries/zed-extensions orgs, depends on their self-hosted
# "namespace-profile-*" runners, and uploads to their own CDN/Sentry/signing
# infrastructure — none of which exists for this fork. This workflow uses
# plain GitHub-hosted runners and uploads straight to the GitHub Release.
#
# macOS builds are ad-hoc signed only (no Apple Developer certificate is
# configured), so the .dmg will trigger a Gatekeeper "unidentified
# developer" warning on first launch — right-click (or control-click) the
# app and choose Open once to bypass it.
#
# Windows builds are unsigned for the same reason (no Azure Trusted Signing
# certificate configured) — script/bundle-windows.ps1 requires those secrets
# whenever the `CI` env var is set, which GitHub Actions sets by default, so
# the windows job clears `CI` just for the build step to skip that check and
# produce an unsigned .exe. Windows SmartScreen will show an "unrecognized
# app" warning on first launch — click "More info" -> "Run anyway".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build and package
        run: ./script/bundle-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: target/release/zed-*-linux-*.tar.gz
          if-no-files-found: error

  linux-aarch64:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build and package
        run: ./script/bundle-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: target/release/zed-*-linux-*.tar.gz
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build and package
        run: ./script/bundle-mac ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/*.dmg
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable git long paths
        # Some cargo git dependencies (e.g. python-environment-tools' test
        # fixtures) exceed Windows' 260-character MAX_PATH. core.longpaths
        # only takes effect for git.exe, so also force cargo to fetch via
        # the CLI instead of its bundled libgit2, which doesn't support it.
        shell: pwsh
        run: |
          git config --system core.longpaths true
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup show
          if ("${{ matrix.arch }}" -eq "aarch64") {
            rustup target add aarch64-pc-windows-msvc
          }

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build and package
        shell: pwsh
        # Clearing CI skips script/bundle-windows.ps1's Azure Trusted Signing
        # check (see the note at the top of this file) — the resulting .exe
        # is unsigned.
        run: |
          $env:CI = $null
          ./script/bundle-windows.ps1 -Architecture ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: target/Zed-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    needs: [linux-x86_64, linux-aarch64, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
